[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "custombuild-rule-engine"
version = "0.1.0"
description = "Deterministic structural screening rules for Custombuild"
requires-python = ">=3.13,<3.14"
dependencies = [
  "custombuild-domain==0.1.0",
  "pydantic==2.13.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/custombuild_rules"]
