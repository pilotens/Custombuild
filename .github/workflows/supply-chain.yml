name: Supply-chain evidence

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-images:
    name: Application image / ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: services/api/Dockerfile
            build_args: ""
          - component: worker
            dockerfile: services/worker/Dockerfile
            build_args: "--build-arg INSTALL_FREECAD=true"
          - component: web
            dockerfile: apps/web/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build candidate image
        shell: bash
        run: |
          set -euo pipefail
          build_date="$(git show -s --format=%cI '${{ github.sha }}')"
          lock_name="DEPENDENCY_LOCK_SHA256"
          lock_file="uv.lock"
          if [ "${{ matrix.component }}" = "web" ]; then
            lock_name="FRONTEND_LOCK_SHA256"
            lock_file="pnpm-lock.yaml"
          fi
          lock_sha256="$(sha256sum "$lock_file" | awk '{print $1}')"
          source_manifest_sha256="$(python3 scripts/source_manifest.py --repo .)"
          python3 scripts/source_manifest.py \
            --repo . \
            --expect-sha256 "$source_manifest_sha256"
          docker build \
            --file "${{ matrix.dockerfile }}" \
            ${{ matrix.build_args }} \
            --build-arg "APP_VERSION=0.1.0+${{ github.sha }}" \
            --build-arg "VCS_REF=${{ github.sha }}" \
            --build-arg "BUILD_DATE=${build_date}" \
            --build-arg "SOURCE_URL=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "SOURCE_MANIFEST_SHA256=${source_manifest_sha256}" \
            --build-arg "${lock_name}=${lock_sha256}" \
            --tag "custombuild-${{ matrix.component }}:supply-chain-${{ github.sha }}" \
            .
      - name: Verify and record candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          image="custombuild-${{ matrix.component }}:supply-chain-${{ github.sha }}"
          revision="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          source="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
          created="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.created" }}')"
          version="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          source_manifest_sha256="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.custombuild.source-manifest.sha256" }}')"
          lock_name="DEPENDENCY_LOCK_SHA256"
          lock_label="io.custombuild.dependency-lock.sha256"
          lock_file="uv.lock"
          dependency_lock_sha256=""
          frontend_lock_sha256=""
          if [ "${{ matrix.component }}" = "web" ]; then
            lock_name="FRONTEND_LOCK_SHA256"
            lock_label="io.custombuild.frontend-lock.sha256"
            lock_file="pnpm-lock.yaml"
          fi
          lock_sha256="$(docker image inspect "$image" --format "{{ index .Config.Labels \"${lock_label}\" }}")"
          runtime_identity="$(docker image inspect "$image" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          digest="$(docker image inspect "$image" --format '{{ .Id }}')"
          expected_lock_sha256="$(sha256sum "$lock_file" | awk '{print $1}')"
          expected_source_manifest_sha256="$(python3 scripts/source_manifest.py --repo .)"
          if [ "${{ matrix.component }}" = "web" ]; then
            frontend_lock_sha256="$lock_sha256"
          else
            dependency_lock_sha256="$lock_sha256"
          fi
          test "$version" = "0.1.0+${{ github.sha }}"
          test "$revision" = "${{ github.sha }}"
          test "$source" = "${{ github.server_url }}/${{ github.repository }}"
          test -n "$created"
          test "$lock_sha256" = "$expected_lock_sha256"
          test "$source_manifest_sha256" = "$expected_source_manifest_sha256"
          grep --quiet --fixed-strings "APP_VERSION=${version}" <<< "$runtime_identity"
          grep --quiet --fixed-strings "VCS_REF=${revision}" <<< "$runtime_identity"
          grep --quiet --fixed-strings "BUILD_DATE=${created}" <<< "$runtime_identity"
          grep --quiet --fixed-strings "SOURCE_URL=${source}" <<< "$runtime_identity"
          grep --quiet --fixed-strings "SOURCE_MANIFEST_SHA256=${source_manifest_sha256}" <<< "$runtime_identity"
          grep --quiet --fixed-strings "${lock_name}=${lock_sha256}" <<< "$runtime_identity"
          jq -n \
            --arg schema_version "custombuild.release-image.v3" \
            --arg component "${{ matrix.component }}" \
            --arg version "$version" \
            --arg revision "$revision" \
            --arg source "$source" \
            --arg created "$created" \
            --arg source_manifest_sha256 "$source_manifest_sha256" \
            --arg dependency_lock_sha256 "$dependency_lock_sha256" \
            --arg frontend_lock_sha256 "$frontend_lock_sha256" \
            --arg digest "$digest" \
            '{schema_version:$schema_version,component:$component,version:$version,revision:$revision,source:$source,created:$created,source_manifest_sha256:$source_manifest_sha256,dependency_lock_sha256:$dependency_lock_sha256,frontend_lock_sha256:$frontend_lock_sha256,image_digest:$digest}' \
            > "custombuild-${{ matrix.component }}-${{ github.sha }}.release.json"
      - name: Upload immutable image manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: custombuild-${{ matrix.component }}-${{ github.sha }}-release-manifest
          path: custombuild-${{ matrix.component }}-${{ github.sha }}.release.json
          if-no-files-found: error
          retention-days: 30
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: custombuild-${{ matrix.component }}:supply-chain-${{ github.sha }}
          artifact-name: custombuild-${{ matrix.component }}-${{ github.sha }}.spdx.json
          format: spdx-json
          upload-artifact-retention: 30
          upload-release-assets: false
      - name: Block all high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: custombuild-${{ matrix.component }}:supply-chain-${{ github.sha }}
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high

  pinned-runtime-images:
    name: Runtime image / ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: postgres
            image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          - component: redis
            image: redis:7.2.15-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
          - component: seaweedfs
            image: chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Pull reviewed runtime digest
        run: docker pull "${{ matrix.image }}"
      - name: Generate runtime SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}
          artifact-name: custombuild-runtime-${{ matrix.component }}-${{ github.sha }}.spdx.json
          format: spdx-json
          upload-artifact-retention: 30
          upload-release-assets: false
      - name: Block all high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ matrix.image }}
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high
