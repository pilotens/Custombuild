name: Supply-chain evidence

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-images:
    name: Application image / ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: services/api/Dockerfile
          - component: worker
            dockerfile: services/worker/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify immutable repository content root
        run: python3 scripts/source_manifest.py --repo . --check-production-semantic-root
      - name: Build candidate image
        shell: bash
        run: |
          set -euo pipefail
          build_date="$(git show -s --format=%cI '${{ github.sha }}')"
          lock_name="DEPENDENCY_LOCK_SHA256"
          lock_file="uv.lock"
          if [ "${{ matrix.component }}" = "web" ]; then
            lock_name="FRONTEND_LOCK_SHA256"
            lock_file="pnpm-lock.yaml"
          fi
          lock_sha256="$(sha256sum "$lock_file" | awk '{print $1}')"
          source_manifest_sha256="$(python3 scripts/source_manifest.py --repo .)"
          python3 scripts/source_manifest.py \
            --repo . \
            --expect-sha256 "$source_manifest_sha256"
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --build-arg "APP_VERSION=0.1.0+${{ github.sha }}" \
            --build-arg "VCS_REF=${{ github.sha }}" \
            --build-arg "BUILD_DATE=${build_date}" \
            --build-arg "SOURCE_URL=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "SOURCE_MANIFEST_SHA256=${source_manifest_sha256}" \
            --build-arg "${lock_name}=${lock_sha256}" \
            --tag "custombuild-${{ matrix.component }}:supply-chain-${{ github.sha }}" \
            .
      - name: Verify and record candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          image="custombuild-${{ matrix.component }}:supply-chain-${{ github.sha }}"
          revision="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          source="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
          created="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.created" }}')"
          version="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          source_manifest_sha256="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.custombuild.source-manifest.sha256" }}')"
          lock_name="DEPENDENCY_LOCK_SHA256"
          lock_label="io.custombuild.dependency-lock.sha256"
          lock_file="uv.lock"
          dependency_lock_sha256=""
          frontend_lock_sha256=""
          if [ "${{ matrix.component }}" = "web" ]; then
            lock_name="FRONTEND_LOCK_SHA256"
            lock_label="io.custombuild.frontend-lock.sha256"
            lock_file="pnpm-lock.yaml"
          fi
          lock_sha256="$(docker image inspect "$image" --format "{{ index .Config.Labels \"${lock_label}\" }}")"
          runtime_identity="$(docker image inspect "$image" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          digest="$(docker image inspect "$image" --format '{{ .Id }}')"
          expected_lock_sha256="$(sha256sum "$lock_file" | awk '{print $1}')"
          expected_source_manifest_sha256="$(python3 scripts/source_manifest.py --repo .)"
          if [ "${{ matrix.component }}" = "web" ]; then
            frontend_lock_sha256="$lock_sha256"
          else
            dependency_lock_sha256="$lock_sha256"
          fi
          test "$version" = "0.1.0+${{ github.sha }}"
          test "$revision" = "${{ github.sha }}"
          test "$source" = "${{ github.server_url }}/${{ github.repository }}"
          test -n "$created"
          test "$lock_sha256" = "$expected_lock_sha256"
          test "$source_manifest_sha256" = "$expected_source_manifest_sha256"
          grep --quiet --fixed-strings "APP_VERSION=${version}" <<< "$runtime_identity"
          grep --quiet --fixed-strings "VCS_REF=${revision}" <<< "$runtime_identity"
          grep --quiet --fixed-strings "BUILD_DATE=${created}" <<< "$runtime_identity"
          grep --quiet --fixed-strings "SOURCE_URL=${source}" <<< "$runtime_identity"
          grep --quiet --fixed-strings "SOURCE_MANIFEST_SHA256=${source_manifest_sha256}" <<< "$runtime_identity"
          grep --quiet --fixed-strings "${lock_name}=${lock_sha256}" <<< "$runtime_identity"
          jq -n \
            --arg schema_version "custombuild.release-image.v3" \
            --arg component "${{ matrix.component }}" \
            --arg version "$version" \
            --arg revision "$revision" \
            --arg source "$source" \
            --arg created "$created" \
            --arg source_manifest_sha256 "$source_manifest_sha256" \
            --arg dependency_lock_sha256 "$dependency_lock_sha256" \
            --arg frontend_lock_sha256 "$frontend_lock_sha256" \
            --arg digest "$digest" \
            '{schema_version:$schema_version,component:$component,version:$version,revision:$revision,source:$source,created:$created,source_manifest_sha256:$source_manifest_sha256,dependency_lock_sha256:$dependency_lock_sha256,frontend_lock_sha256:$frontend_lock_sha256,image_digest:$digest}' \
            > "custombuild-${{ matrix.component }}-${{ github.sha }}.release.json"
      - name: Upload immutable image manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: custombuild-${{ matrix.component }}-${{ github.sha }}-release-manifest
          path: custombuild-${{ matrix.component }}-${{ github.sha }}.release.json
          if-no-files-found: error
          retention-days: 30
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: custombuild-${{ matrix.component }}:supply-chain-${{ github.sha }}
          artifact-name: custombuild-${{ matrix.component }}-${{ github.sha }}.spdx.json
          format: spdx-json
          upload-artifact-retention: 30
          upload-release-assets: false
      - name: Block all high and critical vulnerabilities
        uses: anchore/scan-action@e49c028b8f5d4ac63b87309b024ea6faceb6bac3 # pinned Grype bootstrap fix
        with:
          image: custombuild-${{ matrix.component }}:supply-chain-${{ github.sha }}
          grype-version: v0.110.0
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high

  pinned-runtime-images:
    name: Runtime image / ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: postgres
            image: cgr.dev/chainguard/postgres:latest@sha256:3af67abef0353ec61f054acf649abb5eaaae9742a9c1c9125e073c7833736060
          - component: redis
            image: redis:7.2.15-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
          - component: volume-init
            image: cgr.dev/chainguard/busybox:latest@sha256:928939fc7f20750dea03366627d83bfa497df565fcf6b55fdddb004ecd8426d6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify immutable repository content root
        run: python3 scripts/source_manifest.py --repo . --check-production-semantic-root
      - name: Pull reviewed runtime digest
        run: docker pull "${{ matrix.image }}"
      - name: Generate runtime SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}
          artifact-name: custombuild-runtime-${{ matrix.component }}-${{ github.sha }}.spdx.json
          format: spdx-json
          upload-artifact-retention: 30
          upload-release-assets: false
      - name: Block all high and critical vulnerabilities
        uses: anchore/scan-action@e49c028b8f5d4ac63b87309b024ea6faceb6bac3 # pinned Grype bootstrap fix
        with:
          image: ${{ matrix.image }}
          grype-version: v0.110.0
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high

  repository-seaweedfs-image:
    name: Repository SeaweedFS image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify immutable repository content root
        run: python3 scripts/source_manifest.py --repo . --check-production-semantic-root
      - name: Build checksum-bound SeaweedFS runtime
        run: >-
          docker build
          --file infra/seaweedfs/Dockerfile
          --tag custombuild-seaweedfs:${{ github.sha }}
          .
      - name: Verify SeaweedFS source and toolchain provenance
        run: |
          set -euo pipefail
          image="custombuild-seaweedfs:${{ github.sha }}"
          source_sha256="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.custombuild.upstream-source.sha256" }}')"
          security_overrides_sha256="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.custombuild.security-overrides.sha256" }}')"
          go_version="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.custombuild.go.version" }}')"
          apache_thrift_version="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.custombuild.go-apache-thrift.version" }}')"
          etcd_client_pkg_version="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.custombuild.go-etcd-client-pkg.version" }}')"
          x_crypto_version="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.custombuild.go-x-crypto.version" }}')"
          x_image_version="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.custombuild.go-x-image.version" }}')"
          x_text_version="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.custombuild.go-x-text.version" }}')"
          image_id="$(docker image inspect "$image" --format '{{.Id}}')"
          test "$source_sha256" = "800a91693e2a4e974ef0e2a157b6a04eff9f4df507303b1cff31b0601081fc30"
          test "$security_overrides_sha256" = "3ae484c86166bb6cd88f24398577d99ed06ea8bf5c9384d5288094d7d7048d05"
          test "$go_version" = "1.26.6"
          test "$apache_thrift_version" = "0.24.0"
          test "$etcd_client_pkg_version" = "3.7.1"
          test "$x_crypto_version" = "0.56.0"
          test "$x_image_version" = "0.45.0"
          test "$x_text_version" = "0.41.0"
          jq -n \
            --arg schema_version "custombuild.seaweedfs-release.v2" \
            --arg revision "${{ github.sha }}" \
            --arg source_sha256 "$source_sha256" \
            --arg security_overrides_sha256 "$security_overrides_sha256" \
            --arg go_version "$go_version" \
            --arg apache_thrift_version "$apache_thrift_version" \
            --arg etcd_client_pkg_version "$etcd_client_pkg_version" \
            --arg x_crypto_version "$x_crypto_version" \
            --arg x_image_version "$x_image_version" \
            --arg x_text_version "$x_text_version" \
            --arg image_id "$image_id" \
            '{schema_version:$schema_version,revision:$revision,source_sha256:$source_sha256,security_overrides_sha256:$security_overrides_sha256,go_version:$go_version,apache_thrift_version:$apache_thrift_version,etcd_client_pkg_version:$etcd_client_pkg_version,x_crypto_version:$x_crypto_version,x_image_version:$x_image_version,x_text_version:$x_text_version,image_id:$image_id}' \
            > "custombuild-seaweedfs-${{ github.sha }}.release.json"
      - name: Generate SeaweedFS SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: custombuild-seaweedfs:${{ github.sha }}
          artifact-name: custombuild-seaweedfs-${{ github.sha }}.spdx.json
          format: spdx-json
          upload-artifact-retention: 30
          upload-release-assets: false
      - name: Block all SeaweedFS high and critical vulnerabilities
        uses: anchore/scan-action@e49c028b8f5d4ac63b87309b024ea6faceb6bac3 # pinned Grype bootstrap fix
        with:
          image: custombuild-seaweedfs:${{ github.sha }}
          grype-version: v0.110.0
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high
      - name: Upload immutable SeaweedFS manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: custombuild-seaweedfs-${{ github.sha }}-release-manifest
          path: custombuild-seaweedfs-${{ github.sha }}.release.json
          if-no-files-found: error
          retention-days: 30
