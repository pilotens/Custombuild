name: Legacy prod snapshot notice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain canonical source
        run: |
          echo "The repository root is the canonical production candidate."
          echo "The retired prod/ snapshot exists only in Git history and is never materialized or deployed."
          echo "Use Production Candidate CI for current release evidence."
