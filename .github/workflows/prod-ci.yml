name: Production Candidate CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod-quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: cgr.dev/chainguard/postgres:latest@sha256:3af67abef0353ec61f054acf649abb5eaaae9742a9c1c9125e073c7833736060
        env:
          POSTGRES_DB: custombuild
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d custombuild"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://custombuild_migrator:strong-migrator-test-password@localhost:5432/custombuild
      RLS_DATABASE_URL: postgresql+psycopg://custombuild_api:strong-api-database-test-password@localhost:5432/custombuild
      WORKER_RLS_DATABASE_URL: postgresql+psycopg://custombuild_worker:strong-worker-database-test-password@localhost:5432/custombuild
      TENANT_GRAPH_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/custombuild
      UV_CACHE_DIR: /tmp/custombuild-prod-uv-cache
      RELEASE_EVIDENCE_DIR: artifacts/release-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install production-candidate dependencies
        run: |
          uv sync --locked --group dev --group cad
          pnpm install --frozen-lockfile
      - name: Audit production frontend dependencies
        run: pnpm audit --prod --audit-level high
      - name: Create least-privilege database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d custombuild -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE custombuild_migrator LOGIN PASSWORD 'strong-migrator-test-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE custombuild_api LOGIN PASSWORD 'strong-api-database-test-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE custombuild_worker LOGIN PASSWORD 'strong-worker-database-test-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE custombuild TO custombuild_migrator, custombuild_api, custombuild_worker;
          GRANT USAGE, CREATE ON SCHEMA public TO custombuild_migrator;
          SQL
      - name: Migrate prod schema
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
          PYTHONPATH: services/api
        run: uv run alembic -c services/api/alembic.ini upgrade head
      - name: Prod migration schema drift
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
          PYTHONPATH: services/api
        run: uv run alembic -c services/api/alembic.ini check
      - name: Full production-candidate quality gate
        run: make check
      - name: Static release controls
        run: >-
          uv run python scripts/release_readiness.py --require-clean
          --output "$RELEASE_EVIDENCE_DIR/static-release-readiness.json"
      - name: Upload SHA-bound static controls
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-release-readiness-${{ github.sha }}
          path: artifacts/release-evidence/static-release-readiness.json
          if-no-files-found: error
          retention-days: 30
      - name: Install browser matrix for same-SHA release evidence
        run: pnpm --dir apps/web exec playwright install --with-deps chromium firefox webkit
      - name: Prod WCAG 2.2 AA against the offline production build
        id: prod_wcag
        env:
          PLAYWRIGHT_REAL_API: "0"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-wcag
        run: pnpm --dir apps/web test:e2e:a11y -- --output=wcag-test-results
      - name: Same-SHA Chromium Firefox and WebKit production workspace acceptance
        env:
          PLAYWRIGHT_REAL_API: "0"
          PLAYWRIGHT_ENVIRONMENT: prod
        run: pnpm --dir apps/web test:e2e
      - name: Upload same-SHA browser and WCAG evidence
        if: always() && steps.prod_wcag.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prod-browser-wcag-evidence-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/playwright-report-wcag
            apps/web/wcag-test-results
          if-no-files-found: error
          retention-days: 30

  prod-compose-acceptance:
    needs: prod-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: custombuild-prod-acceptance
      RELEASE_EVIDENCE_DIR: artifacts/release-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Export immutable Compose build identity
        run: |
          source_manifest_sha256="$(python3 scripts/source_manifest.py --repo .)"
          {
            echo "APP_VERSION=0.1.0+${GITHUB_SHA}"
            echo "VCS_REF=${GITHUB_SHA}"
            echo "BUILD_DATE=$(git show -s --format=%cI "${GITHUB_SHA}")"
            echo "SOURCE_URL=${{ github.server_url }}/${{ github.repository }}"
            echo "SOURCE_MANIFEST_SHA256=${source_manifest_sha256}"
            echo "DEPENDENCY_LOCK_SHA256=$(sha256sum uv.lock | awk '{print $1}')"
            echo "FRONTEND_LOCK_SHA256=$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install prod web dependencies
        run: |
          uv sync --locked
          pnpm install --frozen-lockfile
      - name: Download SHA-bound static controls
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: static-release-readiness-${{ github.sha }}
          path: artifacts/release-evidence
      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Verify source freeze before prod build
        run: python3 scripts/source_manifest.py --repo . --expect-sha256 "$SOURCE_MANIFEST_SHA256"
      - name: Build and start prod stack
        run: >-
          docker compose --file compose.yml up --build --detach
          --wait --wait-timeout 900
      - name: Verify exact native runtimes and excluded tooling
        run: |
          set -euo pipefail
          test "$(docker compose --file compose.yml exec -T web /usr/bin/node --version)" = "v24.19.0"
          docker compose --file compose.yml exec -T web /usr/bin/node -e \
            "if (process.execPath !== '/usr/bin/node' || process.getuid() !== 65532) throw new Error(process.execPath + ':' + process.getuid())"
          docker compose --file compose.yml exec -T api /opt/custombuild-venv/bin/python - <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path

          import uvicorn
          from app.main import app

          assert sys.version_info[:3] == (3, 13, 15), sys.version
          assert os.getuid() == 65532, os.getuid()
          assert Path(sys.executable).resolve() == Path("/usr/bin/python3.13").resolve()
          assert callable(app)
          assert uvicorn.__version__
          for executable in ("pip", "pip3", "pip3.13", "uv", "uvx"):
              assert shutil.which(executable) is None, executable
          PY
          docker compose --file compose.yml exec -T worker /opt/custombuild-venv/bin/python - <<'PY'
          import importlib.util
          import os
          import shutil
          import sys
          from pathlib import Path

          import OCP
          import cadquery as cq
          import vtkmodules.vtkCommonCore
          from custombuild_worker.tasks import celery_app

          assert sys.version_info[:3] == (3, 13, 15), sys.version
          assert os.getuid() == 65532, os.getuid()
          assert Path(sys.executable).resolve() == Path("/usr/bin/python3.13").resolve()
          assert celery_app is not None
          solid = cq.Workplane("XY").box(10, 20, 30).val()
          assert solid.Volume() > 0
          assert importlib.util.find_spec("FreeCAD") is None
          for executable in (
              "pip",
              "pip3",
              "pip3.13",
              "uv",
              "uvx",
              "FreeCAD",
              "FreeCADCmd",
              "freecad",
              "freecadcmd",
          ):
              assert shutil.which(executable) is None, executable
          PY
          docker compose --file compose.yml exec -T scheduler \
            /opt/custombuild-venv/bin/python -c \
            "import os; assert os.getuid() == 65532, os.getuid()"
      - name: Prod design-review and blocked CAM/release acceptance
        run: >-
          python3 scripts/live_acceptance.py
          --base-url http://127.0.0.1:8000
          --run-id "prod-${{ github.run_id }}-${{ github.run_attempt }}"
          --readiness-timeout 180
          --job-timeout 900
      - name: Prod browser acceptance
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://127.0.0.1:8000
          PLAYWRIGHT_ENVIRONMENT: prod
          PLAYWRIGHT_REAL_API: "1"
          PLAYWRIGHT_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm --dir apps/web test:e2e -- --project=chromium-desktop
      - name: Create and verify coordinated backup
        run: >-
          uv run python scripts/compose_backup.py --compose compose.yml
          --output "$RELEASE_EVIDENCE_DIR/backup"
      - name: Restore backup and prove roles, RLS and S3 integrity
        run: >-
          uv run python scripts/restore_drill.py
          --backup "$RELEASE_EVIDENCE_DIR/backup"
          --output "$RELEASE_EVIDENCE_DIR/restore-evidence.json"
      - name: Generate exact API runtime SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: custombuild-api:${{ github.sha }}
          format: spdx-json
          output-file: artifacts/release-evidence/sbom-api.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate exact worker runtime SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: custombuild-worker:${{ github.sha }}
          format: spdx-json
          output-file: artifacts/release-evidence/sbom-worker.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate exact web runtime SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: custombuild-web:${{ github.sha }}
          format: spdx-json
          output-file: artifacts/release-evidence/sbom-web.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate exact SeaweedFS runtime SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: custombuild-seaweedfs:${{ github.sha }}
          format: spdx-json
          output-file: artifacts/release-evidence/sbom-seaweedfs.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate exact PostgreSQL runtime SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: cgr.dev/chainguard/postgres:latest@sha256:3af67abef0353ec61f054acf649abb5eaaae9742a9c1c9125e073c7833736060
          format: spdx-json
          output-file: artifacts/release-evidence/sbom-postgres.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate exact Redis runtime SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: redis:7.2.15-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
          format: spdx-json
          output-file: artifacts/release-evidence/sbom-redis.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate exact volume-init runtime SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: cgr.dev/chainguard/busybox:latest@sha256:928939fc7f20750dea03366627d83bfa497df565fcf6b55fdddb004ecd8426d6
          format: spdx-json
          output-file: artifacts/release-evidence/sbom-volume-init.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Verify native interpreter packages in exact runtime SBOMs
        run: |
          set -euo pipefail
          require_exact_package() {
            sbom="$1"
            package="$2"
            version="$3"
            jq -e --arg package "$package" --arg version "$version" \
              '([.packages[]? | select(.name == $package and .versionInfo == $version)] | length) == 1' \
              "$sbom" >/dev/null
          }
          reject_package_prefix() {
            sbom="$1"
            prefix="$2"
            jq -e --arg prefix "$prefix" \
              '([.packages[]? | select((.name // "") | startswith($prefix))] | length) == 0' \
              "$sbom" >/dev/null
          }
          require_exact_package "$RELEASE_EVIDENCE_DIR/sbom-web.spdx.json" \
            nodejs-24 24.19.0-r0
          reject_package_prefix "$RELEASE_EVIDENCE_DIR/sbom-web.spdx.json" nodejs-26
          for component in api worker; do
            require_exact_package "$RELEASE_EVIDENCE_DIR/sbom-${component}.spdx.json" \
              python-3.13 3.13.15-r2
            require_exact_package "$RELEASE_EVIDENCE_DIR/sbom-${component}.spdx.json" \
              python-3.13-base 3.13.15-r2
            reject_package_prefix "$RELEASE_EVIDENCE_DIR/sbom-${component}.spdx.json" python-3.14
          done
          while read -r package version; do
            require_exact_package "$RELEASE_EVIDENCE_DIR/sbom-worker.spdx.json" \
              "$package" "$version"
          done <<'PACKAGES'
          mesa-gl 26.2.1-r0
          libx11 1.8.13-r5
          libxau 1.0.12-r7
          libxdmcp 1.1.5-r9
          libbsd 0.12.2-r7
          libmd 1.2.0-r2
          libgomp 16.2.0-r1
          libxcb 1.17.0-r15
          libglvnd 1.7.0-r10
          libxml2 2.15.0-r0
          libLLVM-22 22.1.8-r2
          libpciaccess 0.19-r2
          libdrm 2.4.134-r0
          libzstd1 1.5.7-r8
          libelf 0.195-r2
          libxshmfence 1.3.3-r2
          mesa-libgallium 26.2.1-r0
          mesa-gbm 26.2.1-r0
          libudev 261.2-r1
          wayland-libs-client 1.26.0-r0
          wayland-protocols 1.49-r0
          mesa 26.2.1-r0
          libxext 1.3.7-r0
          libxxf86vm 1.1.7-r2
          mesa-glx 26.2.1-r0
          PACKAGES
      - name: Scan exact API runtime image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: custombuild-api:${{ github.sha }}
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: artifacts/release-evidence/scan-api.json
      - name: Scan exact worker runtime image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: custombuild-worker:${{ github.sha }}
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: artifacts/release-evidence/scan-worker.json
      - name: Scan exact web runtime image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: custombuild-web:${{ github.sha }}
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: artifacts/release-evidence/scan-web.json
      - name: Scan exact SeaweedFS runtime image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: custombuild-seaweedfs:${{ github.sha }}
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: artifacts/release-evidence/scan-seaweedfs.json
      - name: Scan exact PostgreSQL runtime image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: cgr.dev/chainguard/postgres:latest@sha256:3af67abef0353ec61f054acf649abb5eaaae9742a9c1c9125e073c7833736060
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: artifacts/release-evidence/scan-postgres.json
      - name: Scan exact Redis runtime image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: redis:7.2.15-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: artifacts/release-evidence/scan-redis.json
      - name: Scan exact volume-init runtime image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: cgr.dev/chainguard/busybox:latest@sha256:928939fc7f20750dea03366627d83bfa497df565fcf6b55fdddb004ecd8426d6
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: artifacts/release-evidence/scan-volume-init.json
      - name: Bind scans to the exact images run by Compose
        run: |
          set -euo pipefail
          image_id() {
            docker image inspect "$1" --format '{{.Id}}'
          }
          runtime_id() {
            container_id="$(docker compose --file compose.yml ps --all --quiet "$1")"
            test -n "$container_id"
            docker container inspect "$container_id" --format '{{.Image}}'
          }
          scan_input() {
            jq --exit-status --raw-output \
              '.source.target.userInput | strings | select(length > 0)' \
              "$RELEASE_EVIDENCE_DIR/scan-$1.json"
          }
          manifest_digest() {
            jq --exit-status --raw-output \
              '.source.target.manifestDigest | strings | select(test("^sha256:[a-f0-9]{64}$"))' \
              "$RELEASE_EVIDENCE_DIR/scan-$1.json"
          }
          scan_image_id() {
            jq --exit-status --raw-output \
              '.source.target.imageID | strings | select(test("^sha256:[a-f0-9]{64}$"))' \
              "$RELEASE_EVIDENCE_DIR/scan-$1.json"
          }
          api_ref="custombuild-api:${GITHUB_SHA}"
          worker_ref="custombuild-worker:${GITHUB_SHA}"
          web_ref="custombuild-web:${GITHUB_SHA}"
          seaweedfs_ref="custombuild-seaweedfs:${GITHUB_SHA}"
          postgres_ref='cgr.dev/chainguard/postgres:latest@sha256:3af67abef0353ec61f054acf649abb5eaaae9742a9c1c9125e073c7833736060'
          redis_ref='redis:7.2.15-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6'
          volume_init_ref='cgr.dev/chainguard/busybox:latest@sha256:928939fc7f20750dea03366627d83bfa497df565fcf6b55fdddb004ecd8426d6'
          api_id="$(image_id "$api_ref")"
          worker_id="$(image_id "$worker_ref")"
          web_id="$(image_id "$web_ref")"
          seaweedfs_id="$(image_id "$seaweedfs_ref")"
          postgres_id="$(image_id "$postgres_ref")"
          redis_id="$(image_id "$redis_ref")"
          volume_init_id="$(image_id "$volume_init_ref")"
          test "$api_id" = "$(runtime_id api)"
          test "$api_id" = "$(runtime_id migrate)"
          test "$worker_id" = "$(runtime_id worker)"
          test "$worker_id" = "$(runtime_id scheduler)"
          test "$web_id" = "$(runtime_id web)"
          test "$seaweedfs_id" = "$(runtime_id object-storage)"
          test "$postgres_id" = "$(runtime_id postgres)"
          test "$redis_id" = "$(runtime_id redis)"
          test "$volume_init_id" = "$(runtime_id object-storage-init)"
          test "$api_id" = "$(scan_image_id api)"
          test "$worker_id" = "$(scan_image_id worker)"
          test "$web_id" = "$(scan_image_id web)"
          test "$seaweedfs_id" = "$(scan_image_id seaweedfs)"
          test "$postgres_id" = "$(scan_image_id postgres)"
          test "$redis_id" = "$(scan_image_id redis)"
          test "$volume_init_id" = "$(scan_image_id volume-init)"
          for component in api worker web seaweedfs postgres redis volume-init; do
            test -s "$RELEASE_EVIDENCE_DIR/scan-${component}.json"
            test -s "$RELEASE_EVIDENCE_DIR/sbom-${component}.spdx.json"
          done
          jq -n \
            --arg schema_version "custombuild.runtime-release-evidence.v3" \
            --arg git_revision "$GITHUB_SHA" \
            --arg source_manifest_sha256 "$SOURCE_MANIFEST_SHA256" \
            --arg api_id "$api_id" \
            --arg worker_id "$worker_id" \
            --arg web_id "$web_id" \
            --arg seaweedfs_id "$seaweedfs_id" \
            --arg postgres_id "$postgres_id" \
            --arg redis_id "$redis_id" \
            --arg volume_init_id "$volume_init_id" \
            --arg api_ref "$api_ref" \
            --arg worker_ref "$worker_ref" \
            --arg web_ref "$web_ref" \
            --arg seaweedfs_ref "$seaweedfs_ref" \
            --arg postgres_ref "$postgres_ref" \
            --arg redis_ref "$redis_ref" \
            --arg volume_init_ref "$volume_init_ref" \
            --arg api_scan_input "$(scan_input api)" \
            --arg worker_scan_input "$(scan_input worker)" \
            --arg web_scan_input "$(scan_input web)" \
            --arg seaweedfs_scan_input "$(scan_input seaweedfs)" \
            --arg postgres_scan_input "$(scan_input postgres)" \
            --arg redis_scan_input "$(scan_input redis)" \
            --arg volume_init_scan_input "$(scan_input volume-init)" \
            --arg api_manifest "$(manifest_digest api)" \
            --arg worker_manifest "$(manifest_digest worker)" \
            --arg web_manifest "$(manifest_digest web)" \
            --arg seaweedfs_manifest "$(manifest_digest seaweedfs)" \
            --arg postgres_manifest "$(manifest_digest postgres)" \
            --arg redis_manifest "$(manifest_digest redis)" \
            --arg volume_init_manifest "$(manifest_digest volume-init)" \
            --arg api_sbom "$(sha256sum "$RELEASE_EVIDENCE_DIR/sbom-api.spdx.json" | awk '{print $1}')" \
            --arg worker_sbom "$(sha256sum "$RELEASE_EVIDENCE_DIR/sbom-worker.spdx.json" | awk '{print $1}')" \
            --arg web_sbom "$(sha256sum "$RELEASE_EVIDENCE_DIR/sbom-web.spdx.json" | awk '{print $1}')" \
            --arg seaweedfs_sbom "$(sha256sum "$RELEASE_EVIDENCE_DIR/sbom-seaweedfs.spdx.json" | awk '{print $1}')" \
            --arg postgres_sbom "$(sha256sum "$RELEASE_EVIDENCE_DIR/sbom-postgres.spdx.json" | awk '{print $1}')" \
            --arg redis_sbom "$(sha256sum "$RELEASE_EVIDENCE_DIR/sbom-redis.spdx.json" | awk '{print $1}')" \
            --arg volume_init_sbom "$(sha256sum "$RELEASE_EVIDENCE_DIR/sbom-volume-init.spdx.json" | awk '{print $1}')" \
            --arg api_scan "$(sha256sum "$RELEASE_EVIDENCE_DIR/scan-api.json" | awk '{print $1}')" \
            --arg worker_scan "$(sha256sum "$RELEASE_EVIDENCE_DIR/scan-worker.json" | awk '{print $1}')" \
            --arg web_scan "$(sha256sum "$RELEASE_EVIDENCE_DIR/scan-web.json" | awk '{print $1}')" \
            --arg seaweedfs_scan "$(sha256sum "$RELEASE_EVIDENCE_DIR/scan-seaweedfs.json" | awk '{print $1}')" \
            --arg postgres_scan "$(sha256sum "$RELEASE_EVIDENCE_DIR/scan-postgres.json" | awk '{print $1}')" \
            --arg redis_scan "$(sha256sum "$RELEASE_EVIDENCE_DIR/scan-redis.json" | awk '{print $1}')" \
            --arg volume_init_scan "$(sha256sum "$RELEASE_EVIDENCE_DIR/scan-volume-init.json" | awk '{print $1}')" \
            '{schema_version:$schema_version,git_revision:$git_revision,source_manifest_sha256:$source_manifest_sha256,status:"PASS",images:[{component:"api",image_id:$api_id,image_reference:$api_ref,scan_input:$api_scan_input,manifest_digest:$api_manifest,sbom_sha256:$api_sbom,scan_status:"PASS",scan_sha256:$api_scan},{component:"worker",image_id:$worker_id,image_reference:$worker_ref,scan_input:$worker_scan_input,manifest_digest:$worker_manifest,sbom_sha256:$worker_sbom,scan_status:"PASS",scan_sha256:$worker_scan},{component:"web",image_id:$web_id,image_reference:$web_ref,scan_input:$web_scan_input,manifest_digest:$web_manifest,sbom_sha256:$web_sbom,scan_status:"PASS",scan_sha256:$web_scan},{component:"seaweedfs",image_id:$seaweedfs_id,image_reference:$seaweedfs_ref,scan_input:$seaweedfs_scan_input,manifest_digest:$seaweedfs_manifest,sbom_sha256:$seaweedfs_sbom,scan_status:"PASS",scan_sha256:$seaweedfs_scan},{component:"postgres",image_id:$postgres_id,image_reference:$postgres_ref,scan_input:$postgres_scan_input,manifest_digest:$postgres_manifest,sbom_sha256:$postgres_sbom,scan_status:"PASS",scan_sha256:$postgres_scan},{component:"redis",image_id:$redis_id,image_reference:$redis_ref,scan_input:$redis_scan_input,manifest_digest:$redis_manifest,sbom_sha256:$redis_sbom,scan_status:"PASS",scan_sha256:$redis_scan},{component:"volume-init",image_id:$volume_init_id,image_reference:$volume_init_ref,scan_input:$volume_init_scan_input,manifest_digest:$volume_init_manifest,sbom_sha256:$volume_init_sbom,scan_status:"PASS",scan_sha256:$volume_init_scan}]}' \
            > "$RELEASE_EVIDENCE_DIR/runtime-evidence.json"
      - name: Produce final release readiness after all required evidence
        run: >-
          uv run python scripts/release_evidence_gate.py
          --repo .
          --static-report "$RELEASE_EVIDENCE_DIR/static-release-readiness.json"
          --backup "$RELEASE_EVIDENCE_DIR/backup"
          --restore-evidence "$RELEASE_EVIDENCE_DIR/restore-evidence.json"
          --runtime-evidence "$RELEASE_EVIDENCE_DIR/runtime-evidence.json"
          --sbom-directory "$RELEASE_EVIDENCE_DIR"
          --output "$RELEASE_EVIDENCE_DIR/release-readiness.json"
      - name: Upload final SHA- and image-bound release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-readiness-${{ github.sha }}
          path: |
            artifacts/release-evidence/release-readiness.json
            artifacts/release-evidence/static-release-readiness.json
            artifacts/release-evidence/runtime-evidence.json
            artifacts/release-evidence/restore-evidence.json
            artifacts/release-evidence/backup/manifest.json
            artifacts/release-evidence/scan-*.json
            artifacts/release-evidence/sbom-*.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Collect prod diagnostics
        if: failure()
        run: |
          docker compose --file compose.yml ps --all || true
          docker compose --file compose.yml logs --no-color --timestamps > prod-compose-acceptance.log || true
          tail --lines=1000 prod-compose-acceptance.log || true
      - name: Upload prod diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prod-compose-acceptance-diagnostics
          path: |
            prod-compose-acceptance.log
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: error
          retention-days: 14
      - name: Stop prod stack
        if: always()
        run: docker compose --file compose.yml down --volumes --remove-orphans --timeout 30
