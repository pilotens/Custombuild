name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: custombuild
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d custombuild"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/custombuild
      RLS_DATABASE_URL: postgresql+psycopg://custombuild_api:api-test-password@localhost:5432/custombuild
      UV_CACHE_DIR: /tmp/custombuild-uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install
        run: uv sync --locked --group dev --group cad
      - name: Create least-privilege database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d custombuild -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE custombuild_api LOGIN PASSWORD 'api-test-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE ROLE custombuild_worker LOGIN PASSWORD 'worker-test-password' NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;
          SQL
      - name: Migrate
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
          PYTHONPATH: services/api
        run: uv run alembic -c services/api/alembic.ini upgrade head
      - name: Migration schema drift
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
          PYTHONPATH: services/api
        run: uv run alembic -c services/api/alembic.ini check
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy packages services
      - name: Test and total coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80
      - name: Domain and CAD 90 percent gate
        run: >-
          uv run pytest tests/unit -q
          --cov=packages/domain/src/custombuild_domain
          --cov=cad/src/custombuild_cad
          --cov-fail-under=90
      - name: Rule engine 90 percent gate
        run: >-
          uv run pytest tests/unit -q
          --cov=packages/rule-engine/src/custombuild_rules
          --cov-fail-under=90
      - name: Manufacturing and CAM 90 percent gate
        run: >-
          uv run pytest tests/unit -q
          --cov=packages/manufacturing/src/custombuild_manufacturing
          --cov=cam/src/custombuild_cam
          --cov=postprocessors/src/custombuild_postprocessors
          --cov-fail-under=90
      - name: OpenAPI contract drift
        env:
          PYTHONPATH: packages/domain/src:packages/rule-engine/src:packages/manufacturing/src:packages/template-sdk/src:cad/src:cam/src:postprocessors/src:services/api:services/worker
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code packages/contracts/openapi.json

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client drift
        run: |
          pnpm --dir apps/web generate:api
          git diff --exit-code apps/web/lib/api-schema.d.ts
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
      - name: Install Playwright Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Production workspace smoke
        run: pnpm --dir apps/web test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Build production web image
        run: docker build --file apps/web/Dockerfile --tag custombuild-web:ci .
      - name: Smoke production web image
        run: |
          container_id=$(docker run --rm --detach --publish 127.0.0.1:3102:3000 custombuild-web:ci)
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3102/; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            docker logs "$container_id"
            exit 1
          fi

          page=$(curl --fail --silent http://127.0.0.1:3102/)
          grep --quiet --fixed-strings '<html lang="sv"' <<< "$page"

  compose-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: custombuild-acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install live-browser Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Build and start complete Compose stack
        run: docker compose --file compose.yml up --build --detach
      - name: Live design-to-release acceptance
        run: >-
          python3 scripts/live_acceptance.py
          --base-url http://127.0.0.1:8000
          --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --readiness-timeout 180
          --job-timeout 900
      - name: Live browser production acceptance
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_REAL_API: "1"
          PLAYWRIGHT_RELEASE_NUMBER: UI-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm --dir apps/web test:e2e
      - name: Collect Compose diagnostics
        if: failure()
        run: |
          docker compose --file compose.yml ps --all || true
          docker compose --file compose.yml logs --no-color --timestamps > compose-acceptance.log || true
          tail --lines=1000 compose-acceptance.log || true
      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-acceptance-diagnostics
          path: |
            compose-acceptance.log
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop Compose stack
        if: always()
        run: docker compose --file compose.yml down --volumes --remove-orphans --timeout 30
