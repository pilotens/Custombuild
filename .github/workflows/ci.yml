name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: cgr.dev/chainguard/postgres:latest@sha256:3af67abef0353ec61f054acf649abb5eaaae9742a9c1c9125e073c7833736060
        env:
          POSTGRES_DB: custombuild
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d custombuild"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://custombuild_migrator:strong-migrator-test-password@localhost:5432/custombuild
      RLS_DATABASE_URL: postgresql+psycopg://custombuild_api:strong-api-database-test-password@localhost:5432/custombuild
      WORKER_RLS_DATABASE_URL: postgresql+psycopg://custombuild_worker:strong-worker-database-test-password@localhost:5432/custombuild
      CAPACITY_ATTESTOR_DATABASE_URL: postgresql+psycopg://custombuild_storage_attestor:strong-capacity-attestor-test-password@localhost:5432/custombuild
      TENANT_GRAPH_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/custombuild
      UV_CACHE_DIR: /tmp/custombuild-uv-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify immutable repository content root
        run: python3 scripts/source_manifest.py --repo . --check-production-semantic-root
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install
        run: uv sync --locked --group dev --group cad
      - name: Verify deterministic source-manifest implementation
        run: uv run pytest tests/unit/test_source_manifest.py -q
      - name: Create least-privilege database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d custombuild -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE custombuild_migrator LOGIN PASSWORD 'strong-migrator-test-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE custombuild_api LOGIN PASSWORD 'strong-api-database-test-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE custombuild_worker LOGIN PASSWORD 'strong-worker-database-test-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE custombuild_storage_attestor LOGIN PASSWORD 'strong-capacity-attestor-test-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE custombuild TO custombuild_migrator, custombuild_api, custombuild_worker, custombuild_storage_attestor;
          GRANT USAGE, CREATE ON SCHEMA public TO custombuild_migrator;
          SQL
      - name: Migrate
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
          PYTHONPATH: services/api
        run: uv run alembic -c services/api/alembic.ini upgrade head
      - name: Migration schema drift
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
          PYTHONPATH: services/api
        run: uv run alembic -c services/api/alembic.ini check
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: |
          uv run mypy packages services
          uv run mypy scripts/storage_capacity_development.py
          uv run mypy scripts/storage_capacity_preflight.py
          uv run mypy scripts/storage_capacity_refresh.py
          uv run mypy scripts/storage_recovery.py
          uv run mypy scripts/activate_joint_retention_registry.py
          uv run mypy scripts/bootstrap_production_identity.py
          uv run mypy scripts/joint_retention_certifier.py
          uv run mypy scripts/verify_production_package.py
      - name: Verify immutable offline package verifier
        run: make trusted-package-verifier-sha256
      - name: Test and total coverage gate
        run: |
          uv run coverage erase
          uv run pytest --cov --cov-report=term-missing --cov-fail-under=80
      - name: Domain and CAD 90 percent gate
        run: |
          uv run coverage erase
          uv run pytest tests/unit -q \
            --cov-reset \
            --cov=packages/domain/src/custombuild_domain \
            --cov=cad/src/custombuild_cad \
            --cov-fail-under=90
      - name: Rule engine 90 percent gate
        run: |
          uv run coverage erase
          uv run pytest tests/unit -q \
            --cov-reset \
            --cov=packages/rule-engine/src/custombuild_rules \
            --cov-fail-under=90
      - name: Manufacturing and CAM 90 percent gate
        run: |
          uv run coverage erase
          uv run pytest tests/unit -q \
            --cov-reset \
            --cov=packages/manufacturing/src/custombuild_manufacturing \
            --cov=cam/src/custombuild_cam \
            --cov=postprocessors/src/custombuild_postprocessors \
            --cov-fail-under=90
      - name: OpenAPI contract drift
        env:
          PYTHONPATH: packages/domain/src:packages/rule-engine/src:packages/manufacturing/src:packages/template-sdk/src:cad/src:cam/src:postprocessors/src:services/api:services/worker
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code packages/contracts/openapi.json

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify immutable repository content root
        run: python3 scripts/source_manifest.py --repo . --check-production-semantic-root
      - name: Export immutable Compose build identity
        run: |
          source_manifest_sha256="$(python3 scripts/source_manifest.py --repo .)"
          {
            echo "APP_VERSION=0.1.0+${GITHUB_SHA}"
            echo "VCS_REF=${GITHUB_SHA}"
            echo "BUILD_DATE=$(git show -s --format=%cI "${GITHUB_SHA}")"
            echo "SOURCE_URL=${{ github.server_url }}/${{ github.repository }}"
            echo "SOURCE_MANIFEST_SHA256=${source_manifest_sha256}"
            echo "DEPENDENCY_LOCK_SHA256=$(sha256sum uv.lock | awk '{print $1}')"
            echo "FRONTEND_LOCK_SHA256=$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          } >> "$GITHUB_ENV"
      - name: Verify source freeze before image build
        run: python3 scripts/source_manifest.py --repo . --expect-sha256 "$SOURCE_MANIFEST_SHA256"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client drift
        run: |
          pnpm --dir apps/web generate:api
          git diff --exit-code apps/web/lib/api-schema.d.ts
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
      - name: Install Playwright browser matrix
        run: pnpm --dir apps/web exec playwright install --with-deps chromium firefox webkit
      - name: Cross-browser production-build offline workspace smoke
        run: pnpm --dir apps/web test:e2e
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-and-wcag-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: error
          retention-days: 14
      - name: Build production web image
        run: |
          python3 scripts/source_manifest.py --repo . --expect-sha256 "$SOURCE_MANIFEST_SHA256"
          build_date="$(git show -s --format=%cI '${{ github.sha }}')"
          lock_sha256="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          docker build \
            --file apps/web/Dockerfile \
            --build-arg "APP_VERSION=0.1.0+${{ github.sha }}" \
            --build-arg "VCS_REF=${{ github.sha }}" \
            --build-arg "BUILD_DATE=${build_date}" \
            --build-arg "SOURCE_URL=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "SOURCE_MANIFEST_SHA256=${SOURCE_MANIFEST_SHA256}" \
            --build-arg "FRONTEND_LOCK_SHA256=${lock_sha256}" \
            --tag custombuild-web:ci \
            .
      - name: Smoke production web image
        run: |
          container_id=$(docker run --rm --detach \
            --publish 127.0.0.1:3102:3000 \
            --env APP_ENV=production \
            --env CUSTOMBUILD_WEB_API_URL=https://api.ci.invalid \
            --env CUSTOMBUILD_WEB_DEMO_TOKEN= \
            --env CUSTOMBUILD_WEB_OIDC_ISSUER=https://identity.ci.invalid/ \
            --env CUSTOMBUILD_WEB_OIDC_CLIENT_ID=custombuild-web \
            --env CUSTOMBUILD_WEB_OIDC_REDIRECT_URI=https://app.ci.invalid/ \
            custombuild-web:ci)
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3102/; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            docker logs "$container_id"
            exit 1
          fi

          page=$(curl --fail --silent http://127.0.0.1:3102/)
          grep --quiet --fixed-strings '<html lang="sv"' <<< "$page"
      - name: Reject blank production web runtime
        run: |
          container_id=$(docker run --rm --detach \
            --publish 127.0.0.1:3103:3000 \
            --env APP_ENV= \
            --health-start-period=1s \
            --health-interval=1s \
            --health-timeout=3s \
            --health-retries=2 \
            custombuild-web:ci)
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT

          status=000
          for attempt in {1..30}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:3103/ || true)
            if [ "$status" != 000 ]; then
              break
            fi
            sleep 1
          done
          case "$status" in
            2*|3*)
              echo "Blank production runtime unexpectedly served HTTP $status"
              docker logs "$container_id"
              exit 1
              ;;
            000)
              echo "Blank production runtime never accepted a connection"
              docker logs "$container_id"
              exit 1
              ;;
          esac

          health=starting
          for attempt in {1..30}; do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            if [ "$health" = unhealthy ]; then
              break
            fi
            sleep 1
          done
          if [ "$health" != unhealthy ]; then
            echo "Blank production runtime did not become unhealthy: $health"
            docker logs "$container_id"
            exit 1
          fi

  compose-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: custombuild-acceptance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify immutable repository content root
        run: python3 scripts/source_manifest.py --repo . --check-production-semantic-root
      - name: Export immutable Compose build identity
        run: |
          source_manifest_sha256="$(python3 scripts/source_manifest.py --repo .)"
          {
            echo "APP_VERSION=0.1.0+${GITHUB_SHA}"
            echo "VCS_REF=${GITHUB_SHA}"
            echo "BUILD_DATE=$(git show -s --format=%cI "${GITHUB_SHA}")"
            echo "SOURCE_URL=${{ github.server_url }}/${{ github.repository }}"
            echo "SOURCE_MANIFEST_SHA256=${source_manifest_sha256}"
            echo "DEPENDENCY_LOCK_SHA256=$(sha256sum uv.lock | awk '{print $1}')"
            echo "FRONTEND_LOCK_SHA256=$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install live-browser matrix
        run: pnpm --dir apps/web exec playwright install --with-deps chromium firefox webkit
      - name: Validate fail-closed external production overlay
        env:
          COMPOSE_PROJECT_NAME: custombuild-external-ci
          POSTGRES_DB: custombuild
          POSTGRES_BOOTSTRAP_USER: custombuild_bootstrap
          POSTGRES_BOOTSTRAP_PASSWORD: strong-postgres-bootstrap-ci-secret
          MIGRATOR_DATABASE_USER: custombuild_migrator
          MIGRATOR_DATABASE_PASSWORD: strong-postgres-migrator-ci-secret
          API_DATABASE_PASSWORD: strong-postgres-api-database-ci-secret
          WORKER_DATABASE_PASSWORD: strong-postgres-worker-database-ci-secret
          CAPACITY_ATTESTOR_DATABASE_USER: custombuild_storage_attestor
          CAPACITY_ATTESTOR_DATABASE_PASSWORD: strong-postgres-capacity-attestor-ci-secret
          REDIS_PASSWORD: strong-production-redis-ci-secret
          S3_ACCESS_KEY: custombuild-ci
          S3_SECRET_KEY: strong-production-s3-ci-secret
          S3_BUCKET: custombuild-artifacts
          MIGRATION_DATABASE_URL: postgresql+psycopg://custombuild_migrator:strong-postgres-migrator-ci-secret@postgres:5432/custombuild
          DATABASE_URL: postgresql+psycopg://custombuild_api:strong-postgres-api-database-ci-secret@postgres:5432/custombuild
          WORKER_DATABASE_URL: postgresql+psycopg://custombuild_worker:strong-postgres-worker-database-ci-secret@postgres:5432/custombuild
          OIDC_ISSUER: https://identity.ci.invalid/
          OIDC_AUDIENCE: custombuild-api
          TRUSTED_PROXY_CIDRS: 172.16.0.0/12
          CORS_ORIGINS: https://app.ci.invalid
          ARTIFACT_SIGNING_SECRET: strong-signing-ci-secret-at-least-32-bytes # gitleaks:allow -- fixed CI-only test value
          S3_BACKUP_ENDPOINT: http://127.0.0.1:9000
          CUSTOMBUILD_WEB_API_URL: https://api.ci.invalid
          CUSTOMBUILD_WEB_OIDC_CLIENT_ID: custombuild-web
          CUSTOMBUILD_WEB_OIDC_REDIRECT_URI: https://app.ci.invalid/
          CUSTOMBUILD_DEPLOY_API_IMAGE: ghcr.io/pilotens/custombuild-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          OBJECT_STORAGE_VOLUME_NAME: custombuild-external-ci-storage
          CAPACITY_ATTESTOR_DATABASE_URL: postgresql+psycopg://custombuild_storage_attestor:strong-postgres-capacity-attestor-ci-secret@postgres:5432/custombuild
          STORAGE_CAPACITY_OPERATOR_CONFIG_PATH: /tmp/custombuild-storage-capacity-operator.json
          STORAGE_CAPACITY_OPERATOR_CONFIG_SHA256: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          STORAGE_CAPACITY_VOLUME_IDENTITY: custombuild-external-ci-storage
          STORAGE_CAPACITY_PROVISIONED_BYTES: "107374182400"
          STORAGE_CAPACITY_METADATA_OVERHEAD_BYTES: "1073741824"
          STORAGE_CAPACITY_EMERGENCY_RESERVE_BYTES: "4294967296"
          STORAGE_CAPACITY_HEADROOM_BYTES: "5368709120"
          STORAGE_CAPACITY_BYTE_LIMIT: "102005473280"
          STORAGE_CAPACITY_OBJECT_LIMIT: "1000000"
          STORAGE_CAPACITY_DEPLOY_DESCRIPTOR_SHA256: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
          DEPLOY_DESCRIPTOR_PATH: /tmp/custombuild-deploy-descriptor.json
          STORAGE_CAPACITY_EVIDENCE_DIRECTORY: /tmp/custombuild-capacity-evidence
        run: |
          touch /tmp/custombuild-storage-capacity-operator.json
          touch /tmp/custombuild-deploy-descriptor.json
          mkdir -p /tmp/custombuild-capacity-evidence
          python3 scripts/check_external_production.py --repo .
      - name: Verify source freeze before Compose build
        run: python3 scripts/source_manifest.py --repo . --expect-sha256 "$SOURCE_MANIFEST_SHA256"
      - name: Build and start complete Compose stack
        run: >-
          docker compose --file compose.yml up --build --detach
          --wait --wait-timeout 900
      - name: Prove PostgreSQL replacement reruns the recovery barrier
        run: |
          set -euo pipefail
          compose=(docker compose --file compose.yml)
          container_id() {
            "${compose[@]}" ps --all --quiet "$1"
          }
          started_at() {
            docker container inspect "$(container_id "$1")" --format '{{.State.StartedAt}}'
          }
          finished_at() {
            docker container inspect "$(container_id "$1")" --format '{{.State.FinishedAt}}'
          }
          recovery_state() {
            "${compose[@]}" exec -T postgres psql \
              --username custombuild_bootstrap \
              --dbname custombuild \
              --tuples-only \
              --no-align \
              --field-separator '|' \
              --set ON_ERROR_STOP=on \
              --command "SELECT maintenance_epoch,
                                recovery_database_started_at = pg_postmaster_start_time(),
                                recovery_completed_at
                         FROM storage_global_quotas WHERE id = 1"
          }
          healthy() {
            test "$(docker container inspect "$(container_id "$1")" \
              --format '{{.State.Health.Status}}')" = "healthy"
          }
          recovery_completed() {
            test "$(docker container inspect "$(container_id storage-recovery)" \
              --format '{{.State.Status}}|{{.State.ExitCode}}')" = "exited|0"
          }

          before_state="$(recovery_state)"
          IFS='|' read -r before_epoch before_boot_bound before_completed_at <<< "$before_state"
          test "$before_boot_bound" = "t"
          test -n "$before_completed_at"
          before_postgres_id="$(container_id postgres)"
          before_attestor_id="$(container_id storage-capacity-attestor)"
          before_api_id="$(container_id api)"
          before_worker_id="$(container_id worker)"
          before_maintenance_worker_id="$(container_id maintenance-worker)"
          before_storage_reaper_worker_id="$(container_id storage-reaper-worker)"
          before_scheduler_id="$(container_id scheduler)"
          before_migrate_started="$(started_at migrate)"
          before_recovery_started="$(started_at storage-recovery)"
          before_attestor_started="$(started_at storage-capacity-attestor)"
          before_api_started="$(started_at api)"
          before_worker_started="$(started_at worker)"
          before_maintenance_worker_started="$(started_at maintenance-worker)"
          before_storage_reaper_worker_started="$(started_at storage-reaper-worker)"
          before_scheduler_started="$(started_at scheduler)"

          database_clients=(
            api
            worker
            maintenance-worker
            storage-reaper-worker
            scheduler
            storage-capacity-attestor
          )
          "${compose[@]}" stop --timeout 60 "${database_clients[@]}"
          for service in "${database_clients[@]}"; do
            test "$(docker container inspect "$(container_id "$service")" \
              --format '{{.State.Status}}')" = "exited"
          done
          before_api_finished="$(finished_at api)"
          before_worker_finished="$(finished_at worker)"
          before_maintenance_worker_finished="$(finished_at maintenance-worker)"
          before_storage_reaper_worker_finished="$(finished_at storage-reaper-worker)"
          before_scheduler_finished="$(finished_at scheduler)"
          before_attestor_finished="$(finished_at storage-capacity-attestor)"

          replacement_services=(
            postgres
            migrate
            storage-recovery
            storage-capacity-attestor
            api
            worker
            maintenance-worker
            storage-reaper-worker
            scheduler
          )
          "${compose[@]}" up --detach --force-recreate "${replacement_services[@]}"

          restart_proved=false
          for _ in $(seq 1 900); do
            if current_state="$(recovery_state 2>/dev/null)"; then
              IFS='|' read -r current_epoch current_boot_bound current_completed_at \
                <<< "$current_state"
              if [[ "$current_epoch" =~ ^[0-9]+$ ]] \
                && (( current_epoch > before_epoch )) \
                && test "$current_boot_bound" = "t" \
                && test -n "$current_completed_at" \
                && test "$(container_id postgres)" != "$before_postgres_id" \
                && test "$(container_id storage-capacity-attestor)" != "$before_attestor_id" \
                && test "$(container_id api)" != "$before_api_id" \
                && test "$(container_id worker)" != "$before_worker_id" \
                && test "$(container_id maintenance-worker)" != "$before_maintenance_worker_id" \
                && test "$(container_id storage-reaper-worker)" != "$before_storage_reaper_worker_id" \
                && test "$(container_id scheduler)" != "$before_scheduler_id" \
                && test "$(started_at migrate)" != "$before_migrate_started" \
                && test "$(started_at storage-recovery)" != "$before_recovery_started" \
                && test "$(started_at storage-capacity-attestor)" != "$before_attestor_started" \
                && test "$(started_at api)" != "$before_api_started" \
                && test "$(started_at worker)" != "$before_worker_started" \
                && test "$(started_at maintenance-worker)" != "$before_maintenance_worker_started" \
                && test "$(started_at storage-reaper-worker)" != "$before_storage_reaper_worker_started" \
                && test "$(started_at scheduler)" != "$before_scheduler_started" \
                && recovery_completed \
                && healthy storage-capacity-attestor \
                && healthy api \
                && healthy worker \
                && healthy maintenance-worker \
                && healthy storage-reaper-worker \
                && healthy scheduler; then
                restart_proved=true
                break
              fi
            fi
            sleep 1
          done
          test "$restart_proved" = "true"

          python3 - \
            "$before_api_finished" \
            "$before_worker_finished" \
            "$before_maintenance_worker_finished" \
            "$before_storage_reaper_worker_finished" \
            "$before_scheduler_finished" \
            "$before_attestor_finished" \
            "$(started_at postgres)" \
            "$current_completed_at" \
            "$(started_at storage-capacity-attestor)" \
            "$(started_at api)" \
            "$(started_at worker)" \
            "$(started_at maintenance-worker)" \
            "$(started_at storage-reaper-worker)" \
            "$(started_at scheduler)" <<'PY'
          import datetime
          import sys

          def timestamp(value: str) -> datetime.datetime:
              return datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))

          old_finished = [timestamp(value) for value in sys.argv[1:7]]
          postgres_started = timestamp(sys.argv[7])
          completed = timestamp(sys.argv[8])
          for finished in old_finished:
              assert finished <= postgres_started, (finished, postgres_started)
          assert postgres_started <= completed, (postgres_started, completed)
          for started_value in sys.argv[9:]:
              started = timestamp(started_value)
              assert started >= completed, (started, completed)
          PY
      - name: Live design-review and blocked CAM/release acceptance
        run: >-
          python3 scripts/live_acceptance.py
          --base-url http://127.0.0.1:8000
          --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --readiness-timeout 180
          --job-timeout 900
      - name: Live browser production acceptance
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://127.0.0.1:8000
          PLAYWRIGHT_ENVIRONMENT: test
          PLAYWRIGHT_REAL_API: "1"
          PLAYWRIGHT_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          pnpm --dir apps/web exec playwright test --project=chromium-desktop
          pnpm --dir apps/web exec playwright test e2e/production-live.spec.ts \
            --project=firefox-desktop --project=webkit-desktop
      - name: Collect Compose diagnostics
        if: failure()
        run: |
          docker compose --file compose.yml ps --all || true
          docker compose --file compose.yml logs --no-color --timestamps > compose-acceptance.log || true
          tail --lines=1000 compose-acceptance.log || true
      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-acceptance-diagnostics
          path: |
            compose-acceptance.log
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop Compose stack
        if: always()
        run: docker compose --file compose.yml down --volumes --remove-orphans --timeout 30
