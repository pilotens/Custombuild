[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "custombuild-domain"
version = "0.1.0"
description = "Deterministic canonical product model for Custombuild"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.13.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/custombuild_domain"]
