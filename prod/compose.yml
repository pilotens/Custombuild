name: custombuild

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-custombuild}
      POSTGRES_USER: ${POSTGRES_USER:-custombuild_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-migrator}
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:-change-me-api}
      WORKER_DATABASE_PASSWORD: ${WORKER_DATABASE_PASSWORD:-change-me-worker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-custombuild_migrator} -d ${POSTGRES_DB:-custombuild}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7.2.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-custombuild}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-object-storage}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "scripts.run_migrations"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+psycopg://custombuild_migrator:change-me-migrator@postgres:5432/custombuild}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://custombuild_api:change-me-api@postgres:5432/custombuild}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_MODE: ${AUTH_MODE:-development}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-custombuild-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ARTIFACT_SIGNING_SECRET: ${ARTIFACT_SIGNING_SECRET:-change-me-signing-secret-at-least-32-bytes}
      ARTIFACT_URL_TTL_SECONDS: ${ARTIFACT_URL_TTL_SECONDS:-300}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-custombuild}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-object-storage}
      S3_BUCKET: ${S3_BUCKET:-custombuild-artifacts}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql+psycopg://custombuild_worker:change-me-worker@postgres:5432/custombuild}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-custombuild}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-object-storage}
      S3_BUCKET: ${S3_BUCKET:-custombuild-artifacts}
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_DEMO_TOKEN: ${NEXT_PUBLIC_DEMO_TOKEN:-demo-nordic-owner}
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
