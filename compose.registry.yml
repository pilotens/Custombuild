# Generated image references must come from a verified deploy descriptor.
# Always invoke this overlay with `docker compose ... up --no-build`.
x-custombuild-registry-contract:
  schema-version: custombuild.compose-registry.v2
  descriptor-schema-version: custombuild.deploy-descriptor.v3
  required-up-flag: --no-build

services:
