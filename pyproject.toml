[project]
name = "custombuild"
version = "0.1.0"
description = "Deterministic parametric furniture design-to-production platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "boto3==1.39.16",
  "celery==5.5.3",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.13.4",
  "pydantic-settings==2.10.1",
  "pyjwt[crypto]==2.10.1",
  "python-multipart==0.0.20",
  "redis==6.2.0",
  "reportlab==4.4.9",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "coverage==7.10.1",
  "hypothesis==6.136.7",
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
]
cad = [
  "cadquery==2.5.2",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = [
  ".",
  "packages/domain/src",
  "packages/rule-engine/src",
  "packages/manufacturing/src",
  "packages/template-sdk/src",
  "cad/src",
  "cam/src",
  "postprocessors/src",
  "services/api",
  "services/worker",
]
markers = [
  "postgres: requires a live PostgreSQL instance",
  "cad: requires CadQuery/OpenCascade",
  "integration: exercises service boundaries",
]

[tool.coverage.run]
branch = true
source = ["packages/domain/src", "packages/rule-engine/src", "packages/manufacturing/src", "services/api/app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/domain/src:packages/rule-engine/src:packages/manufacturing/src:packages/template-sdk/src:cad/src:cam/src:postprocessors/src:services/api:services/worker"

[[tool.mypy.overrides]]
module = [
  "boto3",
  "botocore.*",
  "celery",
  "reportlab.*",
]
ignore_missing_imports = true
